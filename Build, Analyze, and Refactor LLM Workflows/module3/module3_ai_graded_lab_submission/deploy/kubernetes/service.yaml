apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: rag
  labels:
    app: rag-service
spec:
  type: ClusterIP
  selector:
    app: rag-service
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service-external
  namespace: rag
  labels:
    app: rag-service
  annotations:
    # Cloud load balancer hints (GCP/AWS). Cluster-local tests ignore these.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: LoadBalancer
  selector:
    app: rag-service
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  sessionAffinity: None
